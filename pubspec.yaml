name: onedm
description: Download manager and browser for Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.4
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.0
  open_filex: ^4.5.0
  share_plus: ^10.1.4
  connectivity_plus: ^6.1.0

flutter:
  uses-material-design: true
